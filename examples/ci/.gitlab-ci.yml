# Test stage: trigger the Jenkins UI suite for the pods a change touches.
# JENKINS_URL, JENKINS_USER, JENKINS_TOKEN are masked + protected CI/CD variables.

stages:
  - build
  - test

variables:
  JENKINS_JOB: "ui-regression"
  TARGET_ENV: "Prod US"

compile:
  stage: build
  image: maven:3.9-eclipse-temurin-17
  script:
    - mvn -q -B test-compile

ui-regression:
  stage: test
  image: alpine:3.20
  needs: [compile]
  rules:
    - if: $CI_PIPELINE_SOURCE == "merge_request_event"
    - if: $CI_PIPELINE_SOURCE == "schedule"
      allow_failure: true
  timeout: 3h
  before_script:
    - apk add --no-cache curl jq git bash
  script:
    - MODULES=$(bash ci/changed-modules.sh "$CI_MERGE_REQUEST_DIFF_BASE_SHA")   # files → modules → pods (see changed-modules.sh)
    - SUITE=$([ "$MODULES" = "All Modules" ] && echo "Smoke" || echo "UX Regression")
    - echo "Suite=$SUITE  Modules=$MODULES  Env=$TARGET_ENV"
    - |
      QUEUE=$(curl -sfS -u "$JENKINS_USER:$JENKINS_TOKEN" -X POST -D - -o /dev/null \
        "$JENKINS_URL/job/$JENKINS_JOB/buildWithParameters" \
        --data-urlencode "suite=$SUITE" --data-urlencode "module=$MODULES" \
        --data-urlencode "executionEnv=$TARGET_ENV" --data-urlencode "branch=$CI_COMMIT_REF_NAME" \
        | awk -F': ' 'tolower($1)=="location"{print $2}' | tr -d '\r')
    - |
      until BUILD=$(curl -sfS -u "$JENKINS_USER:$JENKINS_TOKEN" "${QUEUE}api/json" | jq -er '.executable.url'); do sleep 20; done
      echo "Jenkins build: $BUILD"
    - |
      while [ "$(curl -sfS -u "$JENKINS_USER:$JENKINS_TOKEN" "${BUILD}api/json" | jq -r '.building')" = "true" ]; do sleep 60; done
      RESULT=$(curl -sfS -u "$JENKINS_USER:$JENKINS_TOKEN" "${BUILD}api/json" | jq -r '.result')
      echo "Result: $RESULT — report: ${BUILD}serenity/"
      [ "$RESULT" = "SUCCESS" ]
